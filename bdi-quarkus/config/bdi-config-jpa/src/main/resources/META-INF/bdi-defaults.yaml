# Standardized defaults of bdi-config-jpa (ordinal 100: below application.yaml and the platform).
quarkus:
  datasource:
    jdbc:
      min-size: 2
      max-size: 20
      acquisition-timeout: 5S
  transaction-manager:
    default-transaction-timeout: 120S
    enable-recovery: true   # XA recovery on: the object store and node name below are platform keys, per instance
  hibernate-orm:
    log:
      sql: false
    schema-management:
      strategy: none        # environments: the schema is owned by the DBA (or Flyway, cookbook 4)
    jdbc:
      statement-batch-size: 50   # inserts/updates batched (sequence ids only: IDENTITY switches batching off)
      statement-fetch-size: 100  # rows per round trip when streaming a result set
    fetch:
      batch-size: 16             # lazy collections and proxies loaded 16 owners at a time (the N+1 safety net)
"%dev":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
      log:
        sql: true
        format-sql: true
"%test":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
