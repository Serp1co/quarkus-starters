# ---------------------------------------------------------------------------
# Rendered by the platform (AAP, group_vars/<env>/poc-a-jakarta-classic), common part.
# On a VM this file lives at /etc/bdi/poc-a-jakarta-classic/application.properties, owned by the
# service user; on Podman it is a bind mount, on OpenShift a ConfigMap. The application never ships it.
# Keys and their meaning: META-INF/config-contract.json in the artifact (also README.md, "Config contract").
# ---------------------------------------------------------------------------

# Datasource (platform key, required). The bank's database, not a Dev Services container.
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/poc
quarkus.datasource.username=poc
quarkus.datasource.jdbc.max-size=20

# Ledger rules (application keys). The environment-specific values are in application-<env>.properties.
ledger.currency=EUR
ledger.transfer.max-amount=2500.00
