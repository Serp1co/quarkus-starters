# =============================================================================
# POC A - developer-owned configuration (design notes 2.1 and 2.2)
#
# Rules, enforced by ArtifactConfigLintTest:
#   * no %prod. or environment profile keys: the artifact is built once and
#     configured per environment by the platform;
#   * only build-time choices and %dev / %test inner-loop keys live here.
#
# Everything a deployed instance needs is rendered by the platform into the
# file(s) named by QUARKUS_CONFIG_LOCATIONS (see platform/README.md). What
# must be rendered is the contract in META-INF/config-contract.json.
# =============================================================================

# --- build-time choice, baked into the artifact (destined for bdi-quarkus-observability)
# Health and the conformance endpoint live on a separate management port (9000).
quarkus.management.enabled=true

# --- inner loop: dev mode. Dev Services start a PostgreSQL container; nothing to configure.
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql
%dev.quarkus.log.console.json.enabled=false
%dev.ledger.transfer.max-amount=10000.00

# --- inner loop: tests (continuous testing). Dev Services again, or an external
#     PostgreSQL through QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD.
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.log.console.json.enabled=false
%test.ledger.transfer.max-amount=1000.00
%test.ledger.transfer.blocked-ibans=IT66X0100503200000012345678
