---
# Deploy one Quarkus application on one host, the platform way (design notes 2.2, 3 stage 1, 5):
#   render -> fetch artifact -> validate against its contract -> install files and release -> restart gated
#   on readiness -> conformance check. Nothing application-specific lives in this role: the application is
#   named by bdi_app, described by its fragments under {{ bdi_apps_dir }}/{{ bdi_app }} and by the contract
#   inside its artifact.
- name: The application must be named
  ansible.builtin.assert:
    that: bdi_app | length > 0
    fail_msg: "bdi_app is required (survey field of the job template)"
  tags: [always]

# Rendering is controller-side and cheap, and every other step needs its result: it always runs.
- ansible.builtin.import_tasks: render.yml
  tags: [always]

- name: Version and artifact, from the survey or from the release fragment
  ansible.builtin.set_fact:
    bdi_version: "{{ bdi_version if bdi_version | length > 0 else bdi_rendered.platform.release.version | default('') }}"
    bdi_artifact_url: "{{ bdi_artifact_url if bdi_artifact_url | length > 0 else bdi_rendered.platform.release.artifact_url | default('') }}"
    bdi_java_opts: "{{ bdi_rendered.platform.java_opts | default(bdi_java_opts) }}"
    bdi_management_port: "{{ bdi_rendered.config.quarkus.management.port | default(bdi_management_port) }}"
  tags: [always]

- name: Check the required variables
  ansible.builtin.assert:
    that: [bdi_version | length > 0, bdi_artifact_url | length > 0]
    fail_msg: "bdi_version and bdi_artifact_url are required: survey fields, or a release fragment under apps/{{ bdi_app }}"
  tags: [always]
- ansible.builtin.import_tasks: artifact.yml
  tags: [artifact, validate]
- ansible.builtin.import_tasks: validate.yml
  tags: [validate]
- ansible.builtin.import_tasks: install.yml
  tags: [install]
- ansible.builtin.import_tasks: service.yml
  tags: [service]
  when: bdi_service_manager == "systemd"
- ansible.builtin.import_tasks: verify.yml
  tags: [verify]
