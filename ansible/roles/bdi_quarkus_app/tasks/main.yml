---
# Deploy one Quarkus application on one host, the platform way (design notes 2.2, 3 stage 1, 5):
#   render -> fetch artifact -> validate against its contract -> install files and release -> restart gated
#   on readiness -> conformance check. Nothing application-specific lives in this role: the application is
#   named by bdi_app, described by its fragments under {{ bdi_apps_dir }}/{{ bdi_app }} and by the contract
#   inside its artifact.
- name: Check the required variables
  ansible.builtin.assert:
    that: [bdi_app | length > 0, bdi_version | length > 0, bdi_artifact_url | length > 0]
    fail_msg: "bdi_app, bdi_version and bdi_artifact_url are required (survey fields of the job template)"
  tags: [always]

- ansible.builtin.import_tasks: render.yml
  tags: [render, validate]
- ansible.builtin.import_tasks: artifact.yml
  tags: [artifact, validate]
- ansible.builtin.import_tasks: validate.yml
  tags: [validate]
- ansible.builtin.import_tasks: install.yml
  tags: [install]
- ansible.builtin.import_tasks: service.yml
  tags: [service]
  when: bdi_service_manager == "systemd"
- ansible.builtin.import_tasks: verify.yml
  tags: [verify]
