# keystore.yml (EAP keystores and SSL contexts)  ->  the Quarkus TLS registry, quarkus.tls.<name>.* (cookbook 12).
# Owner: application fragment for the names, platform for the files and passwords (vault). The PKCS12 file is
# delivered like a secret, at the same fixed path on every stage; reload-period lets AAP rotate it without a restart.
kind: keystore                      # status: translated
name: default                       # default -> quarkus.tls.*; any other name -> quarkus.tls.<name>.* (named TLS configuration)
path: /etc/bdi/<app>/tls/server.p12 # -> quarkus.tls.key-store.p12.path
password: "${fromvault.tls.KEYSTORE_PASSWORD}"   # -> quarkus.tls.key-store.p12.password (vault)
# alias: server                     # -> quarkus.tls.key-store.p12.alias
# truststore_path: /etc/bdi/<app>/tls/truststore.p12   # -> quarkus.tls.trust-store.p12.path
# truststore_password: "${fromvault.tls.TRUSTSTORE_PASSWORD}"
# reload_period: 1H                 # -> quarkus.tls.reload-period (certificates rotated by AAP are picked up)
# serve_https: true                 # -> quarkus.http.insecure-requests=disabled and quarkus.http.tls-configuration-name=<name>
