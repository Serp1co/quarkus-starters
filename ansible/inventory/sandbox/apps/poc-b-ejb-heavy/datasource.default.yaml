kind: datasource
name: default
type: xa-data-source   # the EAP xa-data-source: the artifact is built with bdi-jpa-xa, the validation checks its contract
driver: postgresql
url: "jdbc:postgresql://127.0.0.1:5432/poc"
user: "${fromvault.app.USERNAME}"
password: "${fromvault.app.PASSWORD}"
pool_min: 2
pool_max: 10
