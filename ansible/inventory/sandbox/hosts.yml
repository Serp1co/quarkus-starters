# Sandbox inventory: the controller plays the role of one UAT VM. Real inventories list the RHEL hosts
# per environment group; the same group_vars/apps layout applies.
all:
  children:
    uat:
      hosts:
        sandbox-vm:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"   # sandbox only: modules run with the controller interpreter
